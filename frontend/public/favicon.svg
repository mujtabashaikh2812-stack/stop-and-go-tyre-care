<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background: dark charcoal circle -->
  <circle cx="32" cy="32" r="32" fill="#111111"/>

  <!-- Left yellow chevron -->
  <polygon points="18,12 8,32 18,52 13,52 3,32 13,12" fill="#FACC15"/>

  <!-- Right yellow chevron -->
  <polygon points="46,12 56,32 46,52 51,52 61,32 51,12" fill="#FACC15"/>

  <!-- STOP text -->
  <text
    x="32"
    y="26"
    text-anchor="middle"
    font-family="Arial Black, Arial, sans-serif"
    font-weight="900"
    font-size="13"
    fill="#FFFFFF"
    letter-spacing="1"
  >STOP</text>

  <!-- Yellow ampersand divider line -->
  <rect x="18" y="31" width="28" height="2" fill="#FACC15" rx="1"/>

  <!-- GO text -->
  <text
    x="32"
    y="47"
    text-anchor="middle"
    font-family="Arial Black, Arial, sans-serif"
    font-weight="900"
    font-size="13"
    fill="#FACC15"
    letter-spacing="1"
  >GO</text>
</svg>
